# ==========================================
# 1. BACKEND DEPLOYMENT & SERVICE (Node.js)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-backend
  template:
    metadata:
      labels:
        app: reminder-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/GITHUB_USERNAME/reminder-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "180Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: reminder-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500

---
# ==========================================
# 2. FRONTEND DEPLOYMENT & SERVICE (Nginx)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-frontend
  template:
    metadata:
      labels:
        app: reminder-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/GITHUB_USERNAME/reminder-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: reminder-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
