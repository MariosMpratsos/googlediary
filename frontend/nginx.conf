server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # 1. PRO GZIP COMPRESSION (Μειώνει το μέγεθος κατά ~70-80%)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;        # Η τέλεια ισορροπία ταχύτητας/συμπίεσης (χωρίς να καίει CPU στο t3.micro)
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;      # Δεν συμπιέζει πολύ μικρά αρχεία (<256 bytes) γιατί δεν αξίζει

    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ==========================================
    # 2. BROWSER CACHING ΓΙΑ ΤΑ VITE ASSETS
    # ==========================================
    # Το Vite βάζει hashes στα ονόματα των αρχείων (π.χ. index-a1b2c3.js),
    # οπότε μπορούμε άφοβα να πούμε στον browser να τα κρατάει στην cache για 1 χρόνο!
    location ~* \.(?:js|css|woff2?|eot|ttf|otf|ico|svg|webp|png|jpg|jpeg|gif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ==========================================
    # 3. REACT / VITE ROUTING (SPA Fallback)
    # ==========================================
    location / {
        # Το index.html ΔΕΝ πρέπει να μένει στην cache για να παίρνει ο χρήστης αμέσως τα νέα updates
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # 4. SECURITY HEADERS (Extra DevOps πόντοι για το CV)
    # ==========================================
    server_tokens off; # Κρύβει την έκδοση του Nginx από τους hackers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
