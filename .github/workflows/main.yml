name: CI/CD Pipeline - Build & Deploy to AWS K3s

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Convert GitHub Username to Lowercase
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: 3. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-backend:latest

      - name: 5. Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-frontend:latest

      - name: 6. Deploy & Pull latest code directly on AWS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Δημιουργία ή ενημέρωση του φάκελου στον server
            if [ -d "/home/ec2-user/googlediary" ]; then
              cd /home/ec2-user/googlediary
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git /home/ec2-user/googlediary
              cd /home/ec2-user/googlediary
            fi

            # Δημιουργία K3s Secret για το GHCR
            sudo /usr/local/bin/k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # Αντικατάσταση του GITHUB_USERNAME και Apply τα Kubernetes manifests
            sed -i "s/GITHUB_USERNAME/${{ env.owner }}/g" k8s/deployment.yaml
            sudo /usr/local/bin/k3s kubectl apply -f k8s/deployment.yaml
            
            # Restart τα deployments για να τραβήξουν τα νέα images
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-backend
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-frontend
