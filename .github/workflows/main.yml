name: CI/CD Pipeline - Build & Deploy to AWS K3s (HTTPS)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Prepare Variables & Encode K8s Manifest
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$OWNER" >> $GITHUB_ENV
          sed "s/GITHUB_USERNAME/$OWNER/g" k8s/deployment.yaml | base64 -w 0 > k8s_b64.txt
          echo "K8S_MANIFEST_B64=$(cat k8s_b64.txt)" >> $GITHUB_ENV

      - name: 3. Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 4a. Build Backend Image (local, for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: backend-test:ci

      - name: 4b. Verify Backend Dependencies
        run: |
          docker run --rm backend-test:ci node -e "require('dotenv'); require('express'); require('cors'); require('nodemailer'); console.log('All dependencies found')"

      - name: 4c. Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-backend:latest

      - name: 5. Build and Push Frontend Image (Nginx HTTPS)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-frontend:latest

      - name: 6. Fix Permissions, Auto-Setup K3s & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            KUBECTL="sudo /usr/local/bin/k3s kubectl"

            sudo chown -R ec2-user:ec2-user /home/ec2-user
            mkdir -p /home/ec2-user/app
            chmod -R 755 /home/ec2-user/app

            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi

            if [ ! -f /usr/local/bin/k3s ]; then
              curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --disable servicelb --disable metrics-server --write-kubeconfig-mode 644" sh -
              sleep 10
            fi

            sudo chmod 644 /etc/rancher/k3s/k3s.yaml

            # 1. Secret for pulling from GHCR
            $KUBECTL create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_PAT }} \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            # 2. Secret for EMAIL_USER and EMAIL_PASS
            $KUBECTL create secret generic email-secret \
              --from-literal=EMAIL_USER="${{ secrets.EMAIL_USER }}" \
              --from-literal=EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            # 3. Apply manifest
            echo "${{ env.K8S_MANIFEST_B64 }}" | base64 -d | $KUBECTL apply -f -

            # 4. Force re-pull of :latest
            $KUBECTL rollout restart deployment/reminder-backend
            $KUBECTL rollout restart deployment/reminder-frontend

            # 5. Wait, and fail the pipeline if something crashes
            $KUBECTL rollout status deployment/reminder-frontend --timeout=120s || { $KUBECTL describe pods -l app=reminder-frontend | tail -30; exit 1; }
            $KUBECTL rollout status deployment/reminder-backend --timeout=120s || { $KUBECTL logs deployment/reminder-backend --tail=50; exit 1; }

            $KUBECTL get pods
