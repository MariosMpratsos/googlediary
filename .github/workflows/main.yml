name: CI/CD Pipeline - Build & Deploy to AWS K3s

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reminder-backend:latest

      - name: 4. Build and Push Frontend Docker Image (Vite + Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reminder-frontend:latest

      - name: 5. Deploy to AWS K3s Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl apply -f - <<EOF
            $(cat k8s/deployment.yaml)
            EOF
            sudo k3s kubectl rollout restart deployment/reminder-backend
            sudo k3s kubectl rollout restart deployment/reminder-frontend
