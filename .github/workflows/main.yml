name: CI/CD Pipeline - Build & Deploy to AWS K3s (No DockerHub)

on:
  push:
    branches: [ "main" ]

# Δίνει αυτόματα δικαίωμα στο GitHub Action να ανεβάσει τα Docker images στο δικό σου GitHub!
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Convert GitHub Username to Lowercase (Απαραίτητο για το Docker)
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: 3. Login to GitHub Container Registry (Αυτόματα, χωρίς Secrets!)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-backend:latest

      - name: 5. Build and Push Frontend Image (Vite + Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-frontend:latest

      - name: 6. Deploy to AWS K3s Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Δημιουργεί αυτόματα κλειδί στο K3s για να τραβάει τα images από το GitHub σου (ακόμα κι αν είναι private!)
            sudo k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -

            # Αντικαθιστά αυτόματα το GITHUB_USERNAME μέσα στο deployment.yaml και κάνει deploy!
            sed "s/GITHUB_USERNAME/${{ env.owner }}/g" k8s/deployment.yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl rollout restart deployment/reminder-backend
            sudo k3s kubectl rollout restart deployment/reminder-frontend
