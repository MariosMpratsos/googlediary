name: CI/CD - Build & Deploy to K3s

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare variables
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "K8S_MANIFEST_B64=$(sed "s/GITHUB_USERNAME/$OWNER/g" k8s/deployment.yaml | base64 -w 0)" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/${{ env.OWNER }}/reminder-backend:latest

      - name: Verify backend dependencies
        run: |
          docker run --rm ghcr.io/${{ env.OWNER }}/reminder-backend:latest \
            node -e "require('dotenv'); require('express'); require('cors'); require('nodemailer'); console.log('OK')"

      - name: Push backend
        run: docker push ghcr.io/${{ env.OWNER }}/reminder-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/reminder-frontend:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            KUBECTL="sudo /usr/local/bin/k3s kubectl"

            # Wait for k3s (installed by Terraform at boot)
            timeout 180 bash -c 'until sudo /usr/local/bin/k3s kubectl get nodes &>/dev/null; do sleep 5; done'

            $KUBECTL create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_PAT }} \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            $KUBECTL create secret generic email-secret \
              --from-literal=EMAIL_USER="${{ secrets.EMAIL_USER }}" \
              --from-literal=EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
              --dry-run=client -o yaml | $KUBECTL apply -f -

            echo "${{ env.K8S_MANIFEST_B64 }}" | base64 -d | $KUBECTL apply -f -

            $KUBECTL rollout restart deployment/reminder-backend deployment/reminder-frontend

            $KUBECTL rollout status deployment/reminder-frontend --timeout=120s || { $KUBECTL describe pods -l app=reminder-frontend | tail -30; exit 1; }
            $KUBECTL rollout status deployment/reminder-backend --timeout=120s || { $KUBECTL logs deployment/reminder-backend --tail=50; exit 1; }

            $KUBECTL get pods
