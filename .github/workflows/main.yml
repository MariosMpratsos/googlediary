name: CI/CD Pipeline - Build & Deploy to AWS K3s

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Convert GitHub Username to Lowercase
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: 3. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-backend:latest

      - name: 5. Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-frontend:latest

      - name: 6. Copy K8s manifests to AWS Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "k8s/"
          target: "/home/ec2-user/app"

      - name: 7. Deploy to AWS K3s Cluster via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Δημιουργία K3s Secret για το GHCR
            sudo /usr/local/bin/k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # Εφαρμογή του deployment.yaml από τον φάκελο που μεταφέραμε
            cd /home/ec2-user/app
            sed -i "s/GITHUB_USERNAME/${{ env.owner }}/g" k8s/deployment.yaml
            sudo /usr/local/bin/k3s kubectl apply -f k8s/deployment.yaml
            
            # Restart τα deployments
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-backend
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-frontend
