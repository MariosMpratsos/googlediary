name: CI/CD Pipeline - Build & Deploy to AWS K3s (HTTPS)

on:
  push:
    branches: [ "main" ]

# Permissions για να ανεβαίνουν αυτόματα τα images στο GHCR χωρίς Docker Hub
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Prepare Variables & Encode K8s Manifest
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$OWNER" >> $GITHUB_ENV
          sed "s/GITHUB_USERNAME/$OWNER/g" k8s/deployment.yaml | base64 -w 0 > k8s_b64.txt
          echo "K8S_MANIFEST_B64=$(cat k8s_b64.txt)" >> $GITHUB_ENV

      - name: 3. Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-backend:latest

      - name: 5. Build and Push Frontend Image (Nginx HTTPS)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.owner }}/reminder-frontend:latest

      - name: 6. Fix Permissions, Auto-Setup K3s & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.171.139.5
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 1. Fix Permissions στον φάκελο του ec2-user
            sudo chown -R ec2-user:ec2-user /home/ec2-user
            mkdir -p /home/ec2-user/app
            chmod -R 755 /home/ec2-user/app

            # 2. Αυτόματο 2GB Swap (αν δεν υπάρχει ήδη)
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi

            # 3. Αυτόματη εγκατάσταση K3s με σωστά permissions (644) αν δεν υπάρχει!
            if [ ! -f /usr/local/bin/k3s ]; then
              curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --disable servicelb --disable metrics-server --write-kubeconfig-mode 644" sh -
              sleep 10
            fi

            # Εξασφάλιση ότι ο ec2-user έχει πάντα δικαίωμα ανάγνωσης στο K3s config
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml

            # 4. Δημιουργία K3s Secret για να τραβάει images από το GHCR
            sudo /usr/local/bin/k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # 5. Deploy το deployment.yaml απευθείας στη μνήμη (χωρίς SCP!)
            echo "${{ env.K8S_MANIFEST_B64 }}" | base64 -d | sudo /usr/local/bin/k3s kubectl apply -f -

            # 6. Restart τα pods για να πάρουν την τελευταία έκδοση
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-backend
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/reminder-frontend
