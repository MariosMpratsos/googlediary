---
- name: Setup AWS EC2 with Encrypted K3s and Swap
  hosts: all
  become: yes
  tasks:
    - name: 1. Create 2GB Swap file (Prevent Out-Of-Memory on t3.micro)
      shell: |
        if [ ! -f /swapfile ]; then
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

    - name: 2. Fix home directory permissions for ec2-user
      file:
        path: /home/ec2-user
        owner: ec2-user
        group: ec2-user
        recurse: yes

    - name: 3. Install K3s with Secrets Encryption at Rest enabled
      shell: |
        curl -sfL
