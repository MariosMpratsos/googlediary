- name: Configure AWS EC2 (1GB RAM Optimization) & Install K3s
  hosts: aws_ec2
  become: yes
  tasks:
    - name: Create 2GB Swap File to prevent Out-Of-Memory (OOM) crashes
      shell: |
        dd if=/dev/zero of=/swapfile bs=1M count=2048
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Install K3s in Ultra-Light Mode (Saves ~200MB RAM)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --disable servicelb --disable metrics-server --write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s service is running and enabled on boot
      systemd:
        name: k3s
        state: started
        enabled: yes
